name: Rust foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Memory-wall smoke
        run: |
          cargo run -q -p qsolqec-memorywall -- run --representation dense --dimension 2 --subsystems 3 --rounds 2 --max-logical-mib 64 > /tmp/memorywall-dense.json
          cargo run -q -p qsolqec-memorywall -- run --representation stabilizer --dimension 3 --subsystems 2 --rounds 2 --oracle-limit-mib 16 > /tmp/memorywall-stabilizer.json
          cargo run -q -p qsolqec-memorywall -- sweep --representations dense,stabilizer --dimension 2 --start-n 2 --end-n 4 --step 2 --rounds 1 --max-logical-mib 64 --oracle-limit-mib 16 > /tmp/memorywall-sweep.json
